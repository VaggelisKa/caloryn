
only_rules:
  - custom_rules

included:
  - Caloryn
  - CalorynWidgets

excluded:
  - Caloryn/Theme
  - Caloryn/GlassCompatibility.swift

custom_rules:
  raw_list_style:
    name: "Raw list style"
    regex: '\.listStyle\('
    message: "Use calorynGroupedListStyle() or calorynPlainListStyle(). A bare .listStyle lets the List paint a system background over the theme — see CLAUDE.md rule 6."
    severity: error

  raw_system_background_color:
    name: "System background colour"
    regex: '(Color\(\.system|UIColor\.system|\.systemGroupedBackground|\.secondarySystemGroupedBackground|\.systemBackground)'
    message: "Use a CalorynTheme colour. System backgrounds ignore the app palette and differ per appearance in ways the theme does not control."
    severity: error

  raw_white_color:
    name: "Raw white"
    regex: 'Color\.white|Color\(\.white\)|UIColor\.white|\(\s*\.white\s*\)'
    # The barcode scanner draws a UIKit overlay on top of a live camera feed. That text and
    # its reticle are white against video, not against the theme, so they are correctly
    # appearance-independent.
    excluded: ".*BarcodeScannerView\\.swift"
    message: "Use a CalorynTheme colour: backgroundSecondary for the white of a sheet or group, textOnAccent for a label on accent, mealOnFill(_:) for a label on a meal fill. A literal white has no dark appearance, so it turns into a glaring block in dark mode."
    severity: error

  text_token_as_shape:
    name: "Text token on a shape"
    regex: '\.(fill|background|stroke|strokeBorder)\(\s*CalorynTheme\.text\w+|\.tint\(\s*CalorynTheme\.textPrimary\b'
    message: "A text token paints text. Use accent for a control's fill, tint or outline, dataPrimary for a data mark, separator for a line, or a fill* / background* token for a shape. See docs/theme.md."
    severity: error

  background_token_as_text:
    name: "Background token on text"
    regex: '\.foregroundStyle\(\s*CalorynTheme\.background\w+'
    message: "A background token paints a surface. A label on accent is textOnAccent; other text takes a text* token."
    severity: error

  asset_colour_outside_theme:
    name: "Asset colour outside the theme"
    regex: '\bColor\(\.[a-z]\w*\)'
    message: "Read colours through CalorynTheme's role tokens (CalorynShared/CalorynThemeColors.swift), so a re-skin changes the catalog and nothing else."
    severity: error

  trapping_int_conversion:
    name: "Trapping Int conversion"
    regex: '\bInt\((?:[^()]|\([^()]*\))*\.rounded\(\)\)'
    message: "Use Double.truncatedSafely. Int(_:) is a trap, not a conversion — NaN, an infinity or anything past Int64 terminates the process, and these numbers reach it from user input and the food API."
    severity: error

  raw_color_literal:
    name: "Colour literal"
    regex: 'Color\(red:\s*[0-9]'
    message: "Define the colour as a Color Set in CalorynShared/SharedColors.xcassets and expose it through CalorynTheme, so its dark appearance is declared alongside its light one."
    severity: error
