name: Select simulator
description: >
  Boots an available iPhone simulator whose runtime satisfies the app's
  deployment target, from a cached post-first-boot data directory when one
  exists.

inputs:
  minimum-ios:
    description: Lowest acceptable iOS major version.
    required: false
    default: "26"
  preferred-device:
    description: >
      Device model to prefer. Coverage of code that merely runs during app
      start-up varies between simulator models, so pinning one keeps the
      coverage ratchet comparing like with like.
    required: false
    default: "iPhone 17"
  warm-cache:
    description: >
      On a cache miss, let the simulator's first boot settle, then save its
      data directory for later runs. The first boot of a fresh device spends
      several minutes generating posters, widget snapshots and assets, which
      starves a three-core runner; only a job off the critical path should
      pay for warming.
    required: false
    default: "false"

outputs:
  id:
    description: UDID of the booted simulator.
    value: ${{ steps.pick.outputs.id }}
  device:
    description: >
      Model actually selected, slugified. Callers comparing measurements across
      runs (the coverage ratchet) must include this in their cache key so a
      fallback to a different model cannot compare unlike runs.
    value: ${{ steps.pick.outputs.device }}

runs:
  using: composite
  steps:
    - name: Pick simulator
      id: pick
      shell: bash
      env:
        MINIMUM_IOS: ${{ inputs.minimum-ios }}
        PREFERRED_DEVICE: ${{ inputs.preferred-device }}
      run: |
        set -euo pipefail

        xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
        xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"

        selection="$(
          python3 - "$RUNNER_TEMP/simulators.json" "$RUNNER_TEMP/runtimes.json" "$MINIMUM_IOS" "$PREFERRED_DEVICE" <<'PY'
        import json
        import sys

        path, runtimes_path, minimum, preferred = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4]

        with open(path, encoding="utf-8") as file:
            payload = json.load(file)
        with open(runtimes_path, encoding="utf-8") as file:
            builds = {r["identifier"]: r["buildversion"] for r in json.load(file)["runtimes"]}

        candidates = []
        for runtime, devices in payload["devices"].items():
            if "SimRuntime.iOS-" not in runtime:
                continue
            version_part = runtime.split("SimRuntime.iOS-", 1)[1]
            pieces = version_part.split("-")
            try:
                major = int(pieces[0])
                minor = int(pieces[1]) if len(pieces) > 1 else 0
            except ValueError:
                continue
            if major < minimum:
                continue
            for device in devices:
                if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                    candidates.append(((major, minor), dict(device, runtime=runtime)))

        if not candidates:
            sys.exit("No available iPhone simulator with iOS >= %d." % minimum)

        def rank(item):
            (major, minor), device = item
            exact = device.get("name") == preferred
            return (1 if exact else 0, major, minor)

        candidates.sort(key=rank, reverse=True)
        selected = candidates[0][1]
        if selected.get("name") != preferred:
            print(
                "Preferred device %r unavailable; using %r."
                % (preferred, selected.get("name")),
                file=sys.stderr,
            )
        print(selected["udid"])
        print(selected.get("name", "unknown"))
        print(selected["dataPath"])
        print(selected["deviceTypeIdentifier"])
        print(builds[selected["runtime"]])
        PY
        )"

        simulator_id="$(echo "$selection" | sed -n 1p)"
        simulator_name="$(echo "$selection" | sed -n 2p)"
        data_path="$(echo "$selection" | sed -n 3p)"
        device_type="$(echo "$selection" | sed -n 4p)"
        device_slug="$(echo "$simulator_name" | tr ' ' '-' | tr -cd '[:alnum:]-')"
        runtime_build="$(echo "$selection" | sed -n 5p)"
        xcode_build="$(xcodebuild -version | sed -n 's/^Build version //p')"

        echo "Selected simulator $simulator_name ($simulator_id), runtime $runtime_build, Xcode $xcode_build"
        echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
        echo "device=$device_slug" >> "$GITHUB_OUTPUT"
        echo "data-path=$data_path" >> "$GITHUB_OUTPUT"
        echo "cache-key=simulator-data-v1-${device_type##*.}-${runtime_build}-xcode-${xcode_build}" >> "$GITHUB_OUTPUT"

    - name: Restore settled simulator
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ~/simulator-data
        key: ${{ steps.pick.outputs.cache-key }}

    - name: Settle first boot
      if: steps.restore.outputs.cache-hit != 'true' && inputs.warm-cache == 'true'
      shell: bash
      env:
        SIMULATOR_ID: ${{ steps.pick.outputs.id }}
        DATA_PATH: ${{ steps.pick.outputs.data-path }}
      run: |
        set -euo pipefail
        xcrun simctl boot "$SIMULATOR_ID"
        xcrun simctl bootstatus "$SIMULATOR_ID" -b
        "$GITHUB_ACTION_PATH/wait_for_idle.sh"
        xcrun simctl shutdown "$SIMULATOR_ID"
        mv "$DATA_PATH" "$HOME/simulator-data"

    - name: Save settled simulator
      if: steps.restore.outputs.cache-hit != 'true' && inputs.warm-cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/simulator-data
        key: ${{ steps.pick.outputs.cache-key }}

    - name: Boot simulator
      shell: bash
      env:
        SIMULATOR_ID: ${{ steps.pick.outputs.id }}
        DATA_PATH: ${{ steps.pick.outputs.data-path }}
      run: |
        set -euo pipefail
        if [ -d "$HOME/simulator-data" ]; then
          rm -rf "$DATA_PATH"
          mv "$HOME/simulator-data" "$DATA_PATH"
        fi
        xcrun simctl boot "$SIMULATOR_ID" || true
