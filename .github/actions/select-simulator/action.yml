name: Select simulator
description: >
  Boots an available iPhone simulator on a pinned iOS runtime, from a cached
  post-first-boot data directory when one exists.

inputs:
  ios-runtime:
    description: >
      iOS runtime to run on, as major.minor. Pinned rather than "newest" because
      snapshots compare pixels and a different runtime renders differently, so
      an image update that adds a runtime must not move the tests onto it.
    required: false
    default: "27.0"
  device:
    description: >
      Device model to run on. Coverage of code that merely runs during app
      start-up varies between simulator models, so the job fails rather than
      fall back to another model, which would leave the coverage ratchet with
      no baseline to compare against.
    required: false
    default: "iPhone 17"
  warm-cache:
    description: >
      On a cache miss, let the simulator's first boot settle, then save its
      data directory for later runs. The first boot of a fresh device spends
      over ten minutes generating posters, widget snapshots, assets and a
      deferred photo analysis, which starves a three-core runner; only a job
      off the critical path should pay for warming.
    required: false
    default: "false"

outputs:
  id:
    description: UDID of the booted simulator.
    value: ${{ steps.pick.outputs.id }}
  device:
    description: >
      Model selected, slugified. Callers comparing measurements across runs
      (the coverage ratchet) must include this in their cache key so a change
      of model cannot compare unlike runs.
    value: ${{ steps.pick.outputs.device }}

runs:
  using: composite
  steps:
    - name: Pick simulator
      id: pick
      shell: bash
      env:
        IOS_RUNTIME: ${{ inputs.ios-runtime }}
        DEVICE: ${{ inputs.device }}
      run: |
        set -euo pipefail

        xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
        xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"

        selection="$(
          python3 - "$RUNNER_TEMP/simulators.json" "$RUNNER_TEMP/runtimes.json" "$IOS_RUNTIME" "$DEVICE" <<'PY'
        import json
        import sys

        path, runtimes_path, pinned, model = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
        runtime_id = "com.apple.CoreSimulator.SimRuntime.iOS-" + pinned.replace(".", "-")

        with open(path, encoding="utf-8") as file:
            payload = json.load(file)
        with open(runtimes_path, encoding="utf-8") as file:
            builds = {r["identifier"]: r["buildversion"] for r in json.load(file)["runtimes"]}

        candidates = [
            dict(device, runtime=runtime_id)
            for device in payload["devices"].get(runtime_id, [])
            if device.get("isAvailable") and device.get("name") == model
        ]

        if not candidates:
            sys.exit("No available %s simulator on iOS %s." % (model, pinned))

        selected = candidates[0]
        print(selected["udid"])
        print(selected.get("name", "unknown"))
        print(selected["dataPath"])
        print(selected["deviceTypeIdentifier"])
        print(builds[selected["runtime"]])
        PY
        )"

        simulator_id="$(echo "$selection" | sed -n 1p)"
        simulator_name="$(echo "$selection" | sed -n 2p)"
        data_path="$(echo "$selection" | sed -n 3p)"
        device_type="$(echo "$selection" | sed -n 4p)"
        device_slug="$(echo "$simulator_name" | tr ' ' '-' | tr -cd '[:alnum:]-')"
        runtime_build="$(echo "$selection" | sed -n 5p)"
        xcode_build="$(xcodebuild -version | sed -n 's/^Build version //p')"

        echo "Selected simulator $simulator_name ($simulator_id), runtime $runtime_build, Xcode $xcode_build"
        echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
        echo "device=$device_slug" >> "$GITHUB_OUTPUT"
        echo "data-path=$data_path" >> "$GITHUB_OUTPUT"
        echo "cache-key=simulator-data-v2-${device_type##*.}-${runtime_build}-xcode-${xcode_build}" >> "$GITHUB_OUTPUT"

    - name: Restore settled simulator
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ~/simulator-data
        key: ${{ steps.pick.outputs.cache-key }}

    - name: Settle first boot
      if: steps.restore.outputs.cache-hit != 'true' && inputs.warm-cache == 'true'
      shell: bash
      env:
        SIMULATOR_ID: ${{ steps.pick.outputs.id }}
        DATA_PATH: ${{ steps.pick.outputs.data-path }}
      run: |
        set -euo pipefail
        xcrun simctl boot "$SIMULATOR_ID"
        "$GITHUB_ACTION_PATH/quiet_services.sh" "$SIMULATOR_ID"
        "$GITHUB_ACTION_PATH/wait_for_idle.sh"
        xcrun simctl shutdown "$SIMULATOR_ID"
        mv "$DATA_PATH" "$HOME/simulator-data"

    - name: Save settled simulator
      if: steps.restore.outputs.cache-hit != 'true' && inputs.warm-cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/simulator-data
        key: ${{ steps.pick.outputs.cache-key }}

    - name: Boot simulator
      shell: bash
      env:
        SIMULATOR_ID: ${{ steps.pick.outputs.id }}
        DATA_PATH: ${{ steps.pick.outputs.data-path }}
      run: |
        set -euo pipefail
        if [ -d "$HOME/simulator-data" ]; then
          rm -rf "$DATA_PATH"
          mv "$HOME/simulator-data" "$DATA_PATH"
        fi
        xcrun simctl boot "$SIMULATOR_ID" || true
        nohup "$GITHUB_ACTION_PATH/quiet_services.sh" "$SIMULATOR_ID" > "$RUNNER_TEMP/quiet-services.log" 2>&1 &
