name: Mutation Audit

# Informational only. This workflow must never block a pull request: a low
# mutation score is a prompt to strengthen assertions, not a build failure.
"on":
  workflow_dispatch:
  schedule:
    # Sundays at 03:00 UTC.
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: mutation-audit
  cancel-in-progress: true

jobs:
  mutate:
    name: Mutation audit
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select simulator
        uses: ./.github/actions/select-simulator

      - name: Install muter
        run: brew install muter-mutation-testing/formulae/muter

      - name: Run mutation audit
        id: mutate
        continue-on-error: true
        run: |
          set -uo pipefail

          # Scoped to the domain core: pure logic that already has real tests
          # and where a surviving mutant means a genuinely weak assertion.
          # Views are excluded because they are covered by journey tests, which
          # are far too slow to rerun once per mutant.
          muter run \
            --format json \
            --output mutation-report.json \
            --files-to-mutate \
              "Caloryn/Services/NutritionCalculator.swift" \
              "Caloryn/Services/ActivityCalorieBudget.swift" \
              "Caloryn/Services/HistoryAnalytics.swift" \
              "Caloryn/Services/HistoryPatternDiscovery.swift" \
              "Caloryn/Services/FavoriteFoodLogging.swift" \
              "Caloryn/Services/DailyReminderPlanner.swift" \
              "Caloryn/Models/ProduceVarietySummary.swift" \
              "Caloryn/Models/NutritionValues.swift" \
              "Caloryn/Models/DailyGoalSnapshot.swift" \
              "Caloryn/Models/GoalEditSeed.swift" \
              "Caloryn/Models/OnboardingProfileSave.swift" \
              "Caloryn/Models/SelectedDayRollover.swift" \
            | tee mutation-output.txt

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail

          {
            echo "## Mutation audit"
            echo
            if [ -f mutation-report.json ]; then
              python3 .github/scripts/mutation_summary.py mutation-report.json
            else
              echo "No report was produced. Check the job log; muter may have"
              echo "failed to build the project or the CLI may have changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-output.txt
          if-no-files-found: ignore
