name: Mutation Audit

# Informational only. This workflow must never block a pull request: a low
# mutation score is a prompt to strengthen assertions, not a build failure.
"on":
  workflow_dispatch:
  schedule:
    # Sundays at 03:00 UTC.
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  # Pinned so a weekly audit cannot change tool underneath a score comparison.
  # Bump deliberately, and expect the score to move when you do.
  MUTER_COMMIT: 7f1f2584e0a27fc05c952a5c8cdd52b10cc9513f

concurrency:
  group: mutation-audit
  cancel-in-progress: true

jobs:
  mutate:
    name: Mutation audit
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select simulator
        uses: ./.github/actions/select-simulator

      # The published formula is muter 16, released September 2023. It cannot
      # parse Xcode 26's build-request.json, and it predates muter's ability to
      # recognise Swift Testing failures at all — most of this suite is
      # `@Test` / `#expect`, so it would have scored those mutants as survivors
      # whatever the tests actually did. The source is maintained; only the
      # release is stale, so build a pinned commit of it.
      - name: Cache muter
        id: muter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/muter/.build/release/muter
          key: muter-${{ runner.os }}-${{ env.MUTER_COMMIT }}

      - name: Build muter
        if: steps.muter-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          git clone --filter=blob:none https://github.com/muter-mutation-testing/muter.git \
            "$RUNNER_TEMP/muter"
          git -C "$RUNNER_TEMP/muter" checkout "$MUTER_COMMIT"
          swift build --package-path "$RUNNER_TEMP/muter" \
            --configuration release --product muter --disable-sandbox

      - name: Put muter on PATH
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/muter/.build/release" >> "$GITHUB_PATH"

      - name: Run mutation audit
        id: mutate
        continue-on-error: true
        run: |
          set -uo pipefail

          # Scoped to the domain core: pure logic that already has real tests
          # and where a surviving mutant means a genuinely weak assertion.
          # Views are excluded because they are covered by journey tests, which
          # are far too slow to rerun once per mutant.
          files=(
            "Caloryn/Services/NutritionCalculator.swift"
            "Caloryn/Services/ActivityCalorieBudget.swift"
            "Caloryn/Services/HistoryAnalytics.swift"
            "Caloryn/Services/HistoryPatternDiscovery.swift"
            "Caloryn/Services/FavoriteFoodLogging.swift"
            "Caloryn/Services/DailyReminderPlanner.swift"
            "Caloryn/AppIntents/CalorynIntentDomain.swift"
            "Caloryn/Models/HistoryRecurringCaloriePattern.swift"
            "Caloryn/Models/ProduceVarietySummary.swift"
            "Caloryn/Models/NutritionValues.swift"
            "Caloryn/Models/DailyGoalSnapshot.swift"
            "Caloryn/Models/GoalEditSeed.swift"
            "Caloryn/Models/GoalEditDraft.swift"
            "Caloryn/Models/CustomFoodDraft.swift"
            "Caloryn/Models/PortionSelection.swift"
            "Caloryn/Models/FoodSearchListing.swift"
            "Caloryn/Models/OnboardingProfileSave.swift"
            "Caloryn/Models/SelectedDayRollover.swift"
          )

          # muter takes ONE comma-separated argument here. Passing the paths as
          # separate arguments makes it accept the first and reject every other
          # one as an unexpected argument — which is exactly what happened on
          # this workflow's first scheduled run.
          printf -v joined '%s,' "${files[@]}"

          muter run \
            --format json \
            --output mutation-report.json \
            --files-to-mutate "${joined%,}" \
            | tee mutation-output.txt

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail

          # A low score never fails this job — that is the whole point of the
          # audit being informational. A *missing report* is different: it means
          # the tool did not run, and a green tick for that taught us nothing
          # for as long as it went unnoticed. This job runs only on a schedule
          # or by hand, so failing it here gates no pull request.
          if [ ! -f mutation-report.json ]; then
            {
              echo "## Mutation audit"
              echo
              echo "muter produced no report, so nothing was measured. This is a"
              echo "broken audit rather than a weak one — check the job log for"
              echo "the invocation error."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Mutation audit"
            echo
            python3 .github/scripts/mutation_summary.py mutation-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-output.txt
          if-no-files-found: ignore
