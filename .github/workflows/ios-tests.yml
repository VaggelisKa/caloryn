name: iOS Tests

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Theme enforcement. Deliberately its own job rather than a build phase: it is fast,
  # it has nothing to do with the simulator, and a lint failure should be readable
  # without scrolling through an xcodebuild log. See docs/theme.md.
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: |
          set -euo pipefail
          # Preinstalled on the macOS runner image; install only if that changes.
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint --version
          swiftlint lint --strict --reporter github-actions-logging

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      device: ${{ steps.simulator.outputs.device }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Package resolution is a network call on every run. Caching it keeps the
      # build off the network in the common case, and the key is the resolved
      # manifest so a dependency change busts it automatically.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Caloryn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select simulator
        id: simulator
        uses: ./.github/actions/select-simulator

      # Package.resolved is tracked, so the versions are already decided.
      # These two flags stop xcodebuild re-resolving over the network on
      # every run, which was costing about 40s per job even on a cache hit.
      - name: Run unit tests
        run: |
          set -euo pipefail

          mkdir -p TestResults
          xcodebuild test \
            -project Caloryn.xcodeproj \
            -scheme Caloryn \
            -testPlan Caloryn-Unit \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath TestResults/Unit.xcresult \
            -clonedSourcePackagesDirPath .spm-cache \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize coverage
        id: coverage
        run: |
          set -euo pipefail

          xcrun xccov view --report --json TestResults/Unit.xcresult > TestResults/coverage.json
          python3 .github/scripts/coverage_report.py TestResults/coverage.json \
            --output TestResults/coverage-summary.md \
            --percent-file TestResults/coverage-percent.txt

          echo "percent=$(cat TestResults/coverage-percent.txt)" >> "$GITHUB_OUTPUT"
          cat TestResults/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Per-line data for the combined-coverage job, which unions it with the
      # UI journeys'. The xccov report above cannot be unioned.
      - name: Export line coverage
        run: |
          set -euo pipefail
          mkdir -p LineCoverage
          python3 .github/scripts/line_coverage.py export TestResults/Unit.xcresult \
            --root "$GITHUB_WORKSPACE" --output LineCoverage/unit-lines.json

      - name: Upload line coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-line-coverage
          path: LineCoverage/unit-lines.json
          if-no-files-found: error

      # The baseline is the coverage percentage last measured on main. Main
      # builds write it and pull requests read it, so a PR fails only when it
      # lowers coverage rather than for missing an arbitrary fixed target.
      #
      # The key includes the simulator model. Coverage of code that merely runs
      # at start-up differs between models, so if a run falls back to a
      # different device it simply finds no baseline and reports without
      # gating, rather than comparing two unlike measurements.
      #
      # The commit sha makes each main build write a *new* key. Cache entries are
      # immutable — saving to an existing key is a silent no-op — so a fixed key
      # froze the baseline at whatever the first main build measured. The exact
      # `key` here can never hit (no baseline is stored under a PR's own sha), so
      # it always falls through to `restore-keys`, which prefix-matches the most
      # recently created baseline for this device.
      - name: Restore coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: coverage-baseline.txt
          key: coverage-baseline-main-${{ steps.simulator.outputs.device }}-${{ github.sha }}
          restore-keys: |
            coverage-baseline-main-${{ steps.simulator.outputs.device }}-

      - name: Check coverage ratchet
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          current="${{ steps.coverage.outputs.percent }}"

          if [ ! -f coverage-baseline.txt ]; then
            echo "No baseline recorded yet; reporting ${current}% without gating."
            exit 0
          fi

          baseline="$(cat coverage-baseline.txt)"
          echo "Baseline (main): ${baseline}%  Current: ${current}%"

          # Small tolerance so trivial line-count churn does not fail a PR.
          if awk "BEGIN { exit !(${current} < ${baseline} - 0.5) }"; then
            echo "::error::Coverage dropped from ${baseline}% to ${current}%."
            exit 1
          fi

          echo "Coverage did not regress."

      - name: Save coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.coverage.outputs.percent }}" > coverage-baseline.txt

      - name: Store coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: coverage-baseline.txt
          key: coverage-baseline-main-${{ steps.simulator.outputs.device }}-${{ github.sha }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      device: ${{ steps.simulator.outputs.device }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Package resolution is a network call on every run. Caching it keeps the
      # build off the network in the common case, and the key is the resolved
      # manifest so a dependency change busts it automatically.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Caloryn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select simulator
        id: simulator
        uses: ./.github/actions/select-simulator

      # As above: resolution is pinned, so do not go to the network for it.
      - name: Run UI tests
        run: |
          set -euo pipefail

          mkdir -p TestResults
          xcodebuild test \
            -project Caloryn.xcodeproj \
            -scheme Caloryn \
            -testPlan Caloryn-UI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath TestResults/UI.xcresult \
            -clonedSourcePackagesDirPath .spm-cache \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Export line coverage
        run: |
          set -euo pipefail
          mkdir -p LineCoverage
          python3 .github/scripts/line_coverage.py export TestResults/UI.xcresult \
            --root "$GITHUB_WORKSPACE" --output LineCoverage/ui-lines.json

      - name: Upload line coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-line-coverage
          path: LineCoverage/ui-lines.json
          if-no-files-found: error

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults
          if-no-files-found: ignore

  # The figure the 70% floor applies to: every executable line counted once,
  # covered when the unit plan or the UI journeys ran it. Views are most of the
  # app's lines and only the journeys reach them, so the unit plan alone cannot
  # say how much of the app is tested. See docs/testing/coverage.md.
  #
  # The unit-plan ratchet above stays: without it, deleting unit tests whose
  # lines a journey also happens to run would not move this number.
  combined-coverage:
    name: Combined coverage
    needs: [unit-tests, ui-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COVERAGE_FLOOR: "70"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download line coverage
        uses: actions/download-artifact@v4
        with:
          pattern: "*-line-coverage"
          path: LineCoverage
          merge-multiple: true

      - name: Combine
        id: coverage
        run: |
          set -euo pipefail

          python3 .github/scripts/line_coverage.py combine \
            --input unit=LineCoverage/unit-lines.json \
            --input ui=LineCoverage/ui-lines.json \
            --output LineCoverage/combined-summary.md \
            --percent-file LineCoverage/combined-percent.txt

          echo "percent=$(cat LineCoverage/combined-percent.txt)" >> "$GITHUB_OUTPUT"
          cat LineCoverage/combined-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage floor
        run: |
          set -euo pipefail

          current="${{ steps.coverage.outputs.percent }}"
          if awk "BEGIN { exit !(${current} < ${COVERAGE_FLOOR}) }"; then
            echo "::error::Combined coverage is ${current}%, below the ${COVERAGE_FLOOR}% floor."
            exit 1
          fi

          echo "Combined coverage ${current}% is at or above the ${COVERAGE_FLOOR}% floor."

      # Same baseline scheme as the unit-plan ratchet (see the comments there),
      # under its own key. Both jobs' devices are in it: either falling back to
      # another model changes what start-up code runs.
      - name: Restore combined coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: combined-coverage-baseline.txt
          key: combined-coverage-baseline-main-${{ needs.unit-tests.outputs.device }}-${{ needs.ui-tests.outputs.device }}-${{ github.sha }}
          restore-keys: |
            combined-coverage-baseline-main-${{ needs.unit-tests.outputs.device }}-${{ needs.ui-tests.outputs.device }}-

      - name: Check combined coverage ratchet
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          current="${{ steps.coverage.outputs.percent }}"

          if [ ! -f combined-coverage-baseline.txt ]; then
            echo "No combined baseline recorded yet; reporting ${current}% without gating."
            exit 0
          fi

          baseline="$(cat combined-coverage-baseline.txt)"
          echo "Baseline (main): ${baseline}%  Current: ${current}%"

          if awk "BEGIN { exit !(${current} < ${baseline} - 0.5) }"; then
            echo "::error::Combined coverage dropped from ${baseline}% to ${current}%."
            exit 1
          fi

          echo "Combined coverage did not regress."

      - name: Save combined coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.coverage.outputs.percent }}" > combined-coverage-baseline.txt

      - name: Store combined coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: combined-coverage-baseline.txt
          key: combined-coverage-baseline-main-${{ needs.unit-tests.outputs.device }}-${{ needs.ui-tests.outputs.device }}-${{ github.sha }}

      - name: Upload combined summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: LineCoverage
          if-no-files-found: ignore
