name: iOS Tests

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint --version
          swiftlint lint --strict --reporter github-actions-logging

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      device: ${{ steps.simulator.outputs.device }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Caloryn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select simulator
        id: simulator
        uses: ./.github/actions/select-simulator

      - name: Run unit tests
        run: |
          set -euo pipefail

          mkdir -p TestResults
          xcodebuild test \
            -project Caloryn.xcodeproj \
            -scheme Caloryn \
            -testPlan Caloryn-Unit \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath TestResults/Unit.xcresult \
            -clonedSourcePackagesDirPath .spm-cache \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize coverage
        id: coverage
        run: |
          set -euo pipefail

          xcrun xccov view --report --json TestResults/Unit.xcresult > TestResults/coverage.json
          python3 .github/scripts/coverage_report.py TestResults/coverage.json \
            --output TestResults/coverage-summary.md \
            --percent-file TestResults/coverage-percent.txt

          echo "percent=$(cat TestResults/coverage-percent.txt)" >> "$GITHUB_OUTPUT"
          cat TestResults/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Export line coverage
        run: |
          set -euo pipefail
          mkdir -p LineCoverage
          python3 .github/scripts/line_coverage.py export TestResults/Unit.xcresult \
            --root "$GITHUB_WORKSPACE" --output LineCoverage/unit-lines.json

      - name: Upload line coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-line-coverage
          path: LineCoverage/unit-lines.json
          if-no-files-found: error

      - name: Restore coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: coverage-baseline.txt
          key: coverage-baseline-main-${{ steps.simulator.outputs.device }}-${{ github.sha }}
          restore-keys: |
            coverage-baseline-main-${{ steps.simulator.outputs.device }}-

      - name: Check coverage ratchet
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          current="${{ steps.coverage.outputs.percent }}"

          if [ ! -f coverage-baseline.txt ]; then
            echo "No baseline recorded yet; reporting ${current}% without gating."
            exit 0
          fi

          baseline="$(cat coverage-baseline.txt)"
          echo "Baseline (main): ${baseline}%  Current: ${current}%"

          if awk "BEGIN { exit !(${current} < ${baseline} - 0.5) }"; then
            echo "::error::Coverage dropped from ${baseline}% to ${current}%."
            exit 1
          fi

          echo "Coverage did not regress."

      - name: Save coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.coverage.outputs.percent }}" > coverage-baseline.txt

      - name: Store coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: coverage-baseline.txt
          key: coverage-baseline-main-${{ steps.simulator.outputs.device }}-${{ github.sha }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      device: ${{ steps.simulator.outputs.device }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Caloryn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select simulator
        id: simulator
        uses: ./.github/actions/select-simulator

      - name: Run UI tests
        run: |
          set -euo pipefail

          mkdir -p TestResults
          xcodebuild test \
            -project Caloryn.xcodeproj \
            -scheme Caloryn \
            -testPlan Caloryn-UI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath TestResults/UI.xcresult \
            -clonedSourcePackagesDirPath .spm-cache \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Export line coverage
        run: |
          set -euo pipefail
          mkdir -p LineCoverage
          python3 .github/scripts/line_coverage.py export TestResults/UI.xcresult \
            --root "$GITHUB_WORKSPACE" --output LineCoverage/ui-lines.json

      - name: Upload line coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-line-coverage
          path: LineCoverage/ui-lines.json
          if-no-files-found: error

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults
          if-no-files-found: ignore

  combined-coverage:
    name: Combined coverage
    needs: [unit-tests, ui-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COVERAGE_FLOOR: "70"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the coverage script
        run: python3 -m unittest discover -v .github/scripts

      - name: Download line coverage
        uses: actions/download-artifact@v4
        with:
          pattern: "*-line-coverage"
          path: LineCoverage
          merge-multiple: true

      - name: Combine
        id: coverage
        run: |
          set -euo pipefail

          python3 .github/scripts/line_coverage.py combine \
            --input unit=LineCoverage/unit-lines.json \
            --input ui=LineCoverage/ui-lines.json \
            --output LineCoverage/combined-summary.md \
            --percent-file LineCoverage/combined-percent.txt

          echo "percent=$(cat LineCoverage/combined-percent.txt)" >> "$GITHUB_OUTPUT"
          cat LineCoverage/combined-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage floor
        run: |
          set -euo pipefail

          current="${{ steps.coverage.outputs.percent }}"
          if awk "BEGIN { exit !(${current} < ${COVERAGE_FLOOR}) }"; then
            echo "::error::Combined coverage is ${current}%, below the ${COVERAGE_FLOOR}% floor."
            exit 1
          fi

          echo "Combined coverage ${current}% is at or above the ${COVERAGE_FLOOR}% floor."

      - name: Restore combined coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: combined-coverage-baseline.txt
          key: combined-coverage-baseline-main-${{ needs.unit-tests.outputs.device }}-${{ needs.ui-tests.outputs.device }}-${{ github.sha }}
          restore-keys: |
            combined-coverage-baseline-main-${{ needs.unit-tests.outputs.device }}-${{ needs.ui-tests.outputs.device }}-

      - name: Check combined coverage ratchet
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          current="${{ steps.coverage.outputs.percent }}"

          if [ ! -f combined-coverage-baseline.txt ]; then
            echo "No combined baseline recorded yet; reporting ${current}% without gating."
            exit 0
          fi

          baseline="$(cat combined-coverage-baseline.txt)"
          echo "Baseline (main): ${baseline}%  Current: ${current}%"

          if awk "BEGIN { exit !(${current} < ${baseline} - 0.5) }"; then
            echo "::error::Combined coverage dropped from ${baseline}% to ${current}%."
            exit 1
          fi

          echo "Combined coverage did not regress."

      - name: Save combined coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.coverage.outputs.percent }}" > combined-coverage-baseline.txt

      - name: Store combined coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: combined-coverage-baseline.txt
          key: combined-coverage-baseline-main-${{ needs.unit-tests.outputs.device }}-${{ needs.ui-tests.outputs.device }}-${{ github.sha }}

      - name: Upload combined summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage
          path: LineCoverage
          if-no-files-found: ignore
